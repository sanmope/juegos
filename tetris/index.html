<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a2b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tetris">
  <title>Tetris</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header>
    <a href="../" class="back">← Juegos</a>
    <h1>Tetris</h1>
    <div class="tools">
      <button id="music" class="icon-btn" title="Música">🎵</button>
      <button id="sfx" class="icon-btn" title="Sonidos">🔔</button>
    </div>
  </header>

  <div class="game">
    <aside class="side left">
      <div class="box hold">
        <h2>Guardada</h2>
        <canvas id="hold"></canvas>
      </div>
      <div class="box stats">
        <div class="stat"><h2>Puntos</h2><div id="score" class="value">0</div></div>
        <div class="stat"><h2>Líneas</h2><div id="lines" class="value">0</div></div>
        <div class="stat"><h2>Nivel</h2><div id="level" class="value">1</div></div>
        <div class="stat record"><h2>Récord</h2><div id="best" class="value">0</div></div>
      </div>
    </aside>

    <div class="well" id="well">
      <canvas id="board"></canvas>
      <div id="overlay" class="overlay"></div>
    </div>

    <aside class="side right">
      <div class="box next">
        <h2>Siguiente</h2>
        <canvas id="next"></canvas>
      </div>
      <button id="pause" class="pause-btn" title="Pausa">⏸</button>
      <div class="keys">
        <div><kbd>←</kbd><kbd>→</kbd> mover</div>
        <div><kbd>↑</kbd> girar</div>
        <div><kbd>↓</kbd> bajar</div>
        <div><kbd>Espacio</kbd> tirar</div>
        <div><kbd>C</kbd> guardar</div>
        <div><kbd>P</kbd> pausa</div>
      </div>
    </aside>
  </div>

  <div class="controls">
    <button data-action="hold" title="Guardar pieza">⧉</button>
    <button data-action="left" title="Izquierda">◀</button>
    <button data-action="rotate" class="big" title="Girar">⟳</button>
    <button data-action="right" title="Derecha">▶</button>
    <button data-action="down" title="Bajar">▼</button>
    <button data-action="drop" title="Tirar hasta abajo">⤓</button>
  </div>

  <script src="game.js?v=4"></script>
</body>
</html>
